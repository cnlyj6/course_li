videos:
  - id: "001"
    category: 注意力
    cover: 你不是没时间
    title: 你不是没时间，是被碎片偷走了
    tags: [时间管理, 自我提升, 认知切片, 干货, 清醒切片]
    publish: |
      你不是没时间，是被碎片偷走了。

      今晚只做一件事：给最重要的事先锁死四十分钟。
      锁不住时间的人，也锁不住结果。

      #时间管理 #自我提升 #认知切片 #干货分享 #清醒切片
    script: |
      你不是没时间。你只是把时间，交给了碎片。
      回一条消息，十分钟没了。刷一条视频，半小时没了。
      真正能改变你的事，从来不是找不到时间，是你舍不得把时间给它。
      今晚只做一件事：给最重要的事，先锁死四十分钟。
      锁不住时间的人，也锁不住结果。
      我是清醒切片，关注我，每天一条能用的认知。

  - id: "002"
    category: 情绪
    cover: 别跟情绪讲道理
    title: 会成事的人，从不跟情绪讲道理
    tags: [情绪管理, 搞钱思维, 认知切片, 清醒切片]
    publish: |
      会成事的人，从不跟情绪讲道理。

      情绪可以有，但行动权不能交给它。
      先做五分钟，状态会跟过来。

      #情绪管理 #自我提升 #搞钱思维 #清醒切片
    script: |
      会成事的人，从不跟情绪讲道理。
      不想做的时候，他们不是说服自己热爱，而是先启动最小动作。
      打开文档，写第一句。打开待办，划掉第一项。
      情绪是天气，行动才是气候。
      你等状态，状态等你动手。
      记住：先做五分钟，再决定要不要继续。
      关注清醒切片，把情绪从方向盘上拿下来。

  - id: "003"
    category: 努力
    cover: 越努力越焦虑？
    title: 为什么你越努力，反而越焦虑
    tags: [焦虑, 努力, 认知提升, 清醒切片]
    publish: |
      为什么你越努力，反而越焦虑？

      因为你把忙碌当成了进展。
      先停一天，只留三件真正会改变结果的事。

      #焦虑 #自我提升 #认知切片 #清醒切片
    script: |
      为什么你越努力，反而越焦虑？
      因为你把忙碌，当成了进展。
      回邮件、改格式、开会、转发资料，看起来整天都在动。
      可真正决定结果的，往往只有三件事。
      努力没有方向，就是昂贵的内耗。
      今天做个实验：停掉所有琐事，只留三件会改变结果的事。
      忙不是勋章，有效才是。
      我是清醒切片，关注我，少做无效功。

  - id: "004"
    category: 职场
    cover: 闭嘴比会说值钱
    title: 职场里，闭嘴往往比会说更值钱
    tags: [职场, 情商, 沟通, 清醒切片]
    publish: |
      职场里，闭嘴往往比会说更值钱。

      会说话的人很多，会把话说在该说的时候，才稀缺。

      #职场干货 #情商 #沟通 #清醒切片
    script: |
      职场里，闭嘴往往比会说更值钱。
      会说话的人很多。会把话说在该说的时候，才稀缺。
      会议里急着表现，容易暴露你没听懂。
      汇报时堆砌细节，领导只会觉得你抓不住重点。
      高段位沟通就三步：先听完整，再复述问题，最后给一个选择。
      不是你没才华，是你把才华说散了。
      关注清醒切片，职场少走弯路。

  - id: "005"
    category: 成果
    cover: 辛苦不等于成果
    title: 别再把辛苦，当成你的成果
    tags: [成果, 复盘, 效率, 清醒切片]
    publish: |
      别再把辛苦，当成你的成果。

      辛苦是过程，成果是别人愿意为此付钱或记住的部分。
      每天问自己：这件事留下了什么可复用的结果？

      #复盘 #效率 #自我提升 #清醒切片
    script: |
      别再把辛苦，当成你的成果。
      加班到半夜，不自动等于你创造了价值。
      辛苦是过程，成果是别人愿意为此付钱，或者记住的部分。
      如果你忙完无法回答三个字：留下了什么？那多半是空转。
      从今天起，每天只问一句：这件事有没有变成可复用的结果。
      一份文档、一个方法、一个成交，都算。
      感动自己很容易，完成交付才算数。
      关注清醒切片，把力气用在能留下痕迹的地方。

  - id: "006"
    category: 时间
    cover: 下班后两小时
    title: 真正拉开差距的，是下班后两小时
    tags: [成长, 时间管理, 副业, 清醒切片]
    publish: |
      真正拉开差距的，是下班后两小时。

      不是要你拼命，是要你把这段时间从刷机里赎回来。
      技能、表达、作品，都在这里长出来。

      #下班成长 #副业 #时间管理 #清醒切片
    script: |
      真正拉开差距的，很少是上班那八小时。
      是下班后，你怎么用那两小时。
      同样下班，有人刷到十二点，有人把一项技能往前推一寸。
      一年下来，差的不是天赋，是一百五十个晚上。
      你不需要学十个项目。你需要把一个作品，重复做三十遍。
      从今晚开始，固定两小时：一小时输入，一小时输出。
      阶层很少一夜改写，但会被这两个小时慢慢改写。
      我是清醒切片，关注我，把晚上要回来。

  - id: "007"
    category: 决策
    cover: 穷富差在一次决策
    title: 穷人和富人，差在一次决策质量
    tags: [决策, 认知, 理财思维, 清醒切片]
    publish: |
      穷人和富人，差在一次决策质量。

      不是玄学，是你愿不愿意为关键选择多停十秒。
      大事慢，小事快。

      #决策 #认知提升 #理财思维 #清醒切片
    script: |
      穷人和富人，差的往往不是机会，是一次决策的质量。
      同样一笔钱，有人买短暂开心，有人买长期杠杆。
      同样一个晚上，有人答应所有人，有人只答应关键的人。
      决策不是灵感，是你愿不愿意为关键选择，多停十秒。
      记住三条：大事慢，小事快；能逆转的可以赌，不能逆转的要保守；别在情绪高峰做决定。
      你会变富，往往不是因为多干了一件事，是少做了一个蠢决定。
      关注清醒切片，把决策权从冲动手里收回来。

  - id: "008"
    category: 社交
    cover: 请停止无效社交
    title: 请停止无效社交，它正在偷走你
    tags: [社交, 边界, 精力管理, 清醒切片]
    publish: |
      请停止无效社交，它正在偷走你的晚上。

      不是让你冷酷，是让你把热情留给真关系、真合作。
      聚会前先问：去了会更清楚，还是更累？

      #社交边界 #精力管理 #自我提升 #清醒切片
    script: |
      请停止无效社交。它正在偷走你的晚上，也偷走你的判断。
      不是让你冷酷。是让你把热情，留给真关系、真合作。
      三小时聚会见二十张脸，不如深聊一个能一起做事的人。
      判断标准很简单：见完你是更清楚，还是更累。
      清爽的人，社交短、反馈快、不欠人情账。
      从下一次邀请开始，先问一句：去了能推进什么。
      推不进就礼貌拒绝。拒绝不是绝情，是保命。
      关注清醒切片，把社交从消耗改成投资。

  - id: "009"
    category: 职场
    cover: 领导到底提拔谁
    title: 领导提拔人，看的不是态度好
    tags: [职场晋升, 能力, 认知, 清醒切片]
    publish: |
      领导提拔人，看的不是态度好。

      态度是入场券，结果、判断、可托付，才是晋级票。
      少表态，多给选择。

      #职场晋升 #职场干货 #清醒切片
    script: |
      领导提拔人，看的不是你态度好不好。
      态度是入场券，不是晋级票。
      他真正看三样：你能不能独立出结果，你能不能替他做判断，你出事时能不能被托付。
      只会说没问题的人，升不上去。因为没问题往往意味着，你把问题藏住了。
      下次汇报，别只说我很努力。说：目标、进度、风险、你需要他拍板的那一项。
      被看见的不是辛苦，是让领导省心。
      关注清醒切片，职场按规则打球。

  - id: "010"
    category: 机会
    cover: 你缺的是筛选
    title: 你缺的不是机会，是筛选能力
    tags: [机会, 选择, 认知, 清醒切片]
    publish: |
      你缺的不是机会，是筛选能力。

      机会太多，才会让人看起来很努力，却哪一件都做不透。
      先写拒绝清单，再谈努力。

      #选择困难 #认知提升 #清醒切片
    script: |
      你缺的不是机会。你缺的是筛选。
      机会太多，才会让人看起来很努力，却哪一件都做不透。
      高手不是什么都抓，是提前写好拒绝清单。
      不碰三类事：不能复用的、不能积累作品的、必须靠运气的。
      剩下的，再谈努力。
      你所谓的迷茫，常常是选择太多，而标准太少。
      今晚就写三条拒绝标准，贴在备忘录第一行。
      选得少，才做得深。关注清醒切片。

  - id: "011"
    category: 钱
    cover: 为什么你存不住钱
    title: 你存不住钱，是因为账户没有隔离
    tags: [存钱, 理财思维, 现金流, 清醒切片]
    publish: |
      你存不住钱，往往不是自制力差，是账户没有隔离。

      工资进账先拆四份：生活、缓冲、成长、长期。
      先分流，再谈省。

      #存钱 #理财思维 #现金流 #清醒切片
    script: |
      你存不住钱，往往不是自制力差，是账户没有隔离。
      所有钱放一个卡里，大脑会把全部余额，当成可以花的钱。
      先做分流：生活账户、缓冲账户、成长账户、长期账户。
      工资进来，先按比例拆走，再谈消费。
      缓冲账户是为了让你遇到事，不必拆掉长期的钱。
      成长账户只用于能提高你单价的学习或工具。
      存钱不是靠忍，是靠结构。结构对了，自制力才够用。
      关注清醒切片，先把钱的通路修好。

  - id: "012"
    category: 情商
    cover: 高情商是会闭嘴
    title: 高情商不是会说话，是会闭嘴
    tags: [情商, 沟通, 关系, 清醒切片]
    publish: |
      高情商不是会说话，是会闭嘴。

      对方要的是被听懂，不是被你的建议盖过去。
      先接住情绪，再给建议。

      #情商 #沟通 #人际关系 #清醒切片
    script: |
      高情商不是会说话，是会闭嘴。
      别人倾诉的时候，你急着给方案，他会觉得自己被打断。
      对方要的常常不是答案，是被听懂。
      三句就够：我听到了；这件事确实很难；你希望我陪你，还是帮你一起想办法。
      把选择权还回去，关系才会松。
      真正的会说，是少说正确的废话。
      关注清醒切片，把沟通从表演改成合作。

  - id: "013"
    category: 复盘
    cover: 失败是因为不复盘
    title: 大多数人失败，是因为从不复盘
    tags: [复盘, 成长, 方法论, 清醒切片]
    publish: |
      大多数人失败，不是因为不够努力，是因为从不复盘。

      每周只问三句：做成了什么，卡在哪，下周只改一件事。

      #复盘 #方法论 #自我提升 #清醒切片
    script: |
      大多数人失败，不是因为不够努力，是因为从不复盘。
      同样的坑踩三次，还觉得是运气不好。
      复盘不是写日记抒情，是把过程拆成可改的零件。
      每周只问三句：这周做成了什么，卡在哪一步，下周只改哪一件事。
      一次只改一个变量，你才知道什么真的有效。
      成长不是多学一门课，是少重复一次错。
      周日晚上二十分钟就够。你愿意给情绪两小时，就该给复盘二十分钟。
      关注清醒切片，让经验开始生利息。

  - id: "014"
    category: 决策
    cover: 先问能不能退出
    title: 别先问值不值得，先问能不能退出
    tags: [决策, 风险, 认知, 清醒切片]
    publish: |
      别先问值不值得，先问能不能退出。

      能退出的试错叫实验，不能退出的叫赌博。
      保底先设好，再谈野心。

      #决策 #风险控制 #认知切片 #清醒切片
    script: |
      别先问值不值得。先问能不能退出。
      能退出的试错，叫实验。不能退出的，叫赌博。
      很多人不是败在不够勇，是败在没有后路还加码。
      做决定前先写清：最坏情况是什么，我能否承受，退出条件是什么。
      时间、金钱、名声，三项里至少留一项不被锁死。
      保底设好了，你才敢把上面的空间用满。
      真正的大胆，是算过账的大胆。
      关注清醒切片，先活下来，再谈赢。

  - id: "015"
    category: 学习
    cover: 收藏不等于学会
    title: 信息过载的人，很难成为高手
    tags: [学习方法, 知识管理, 认知, 清醒切片]
    publish: |
      收藏不等于学会。信息过载的人，很难成为高手。

      输入要服务输出。看完一条，就用自己的话复述一遍。

      #学习方法 #知识管理 #认知切片 #清醒切片
    script: |
      收藏不等于学会。信息过载的人，很难成为高手。
      你不是知道得太少，是用得太少。
      大脑喜欢新刺激，于是你不停收藏、转发、做笔记。
      可技能只认重复和输出。
      从今天起，输入必须服务输出。
      看完一条内容，用自己的话复述三十秒。能复述，才算你的。
      学得少一点，用得深一点，你才会开始像个高手。
      我是清醒切片，关注我，少收藏，多交卷。
